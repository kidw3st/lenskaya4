8805237315" y2="875.4337152209494" stroke="#c6bfb1" stroke-width="1"/><line x1="419.08428805237315" y1="195.49999999999994" x2="430.08428805237315" y2="184.49999999999994" stroke="#5a615a" stroke-width="1.3"/><line x1="419.08428805237315" y1="880.9337152209494" x2="430.08428805237315" y2="869.9337152209494" stroke="#5a615a" stroke-width="1.3"/><g transform="translate(424.58428805237315,532.7168576104747) rotate(-90)"><rect x="-32.44" y="-21.742000000000004" width="64.88" height="18.900000000000002" fill="#faf8f4"/><text x="0" y="-7" font-size="14" fill="#5a615a" text-anchor="middle" font-weight="400">41,88 м</text></g><line x1="476.58428805237315" y1="532.7168576104746" x2="525.684124386252" y2="532.7168576104746" stroke="#7d5c2c" stroke-width="1"/><path d="M476.58428805237315 532.7168576104746 l5.5 -2.6 l0 5.2 Z" fill="#7d5c2c"/><path d="M525.684124386252 532.7168576104746 l-5.5 -2.6 l0 5.2 Z" fill="#7d5c2c"/><rect x="492.6342062193126" y="513.5543576104745" width="17" height="16.875" fill="#faf8f4"/><text x="501.1342062193126" y="526.7168576104746" font-size="12.5" fill="#7d5c2c" text-anchor="middle" font-weight="400">3</text><line x1="900.315875613748" y1="532.7168576104746" x2="949.4157119476268" y2="532.7168576104746" stroke="#7d5c2c" stroke-width="1"/><path d="M900.315875613748 532.7168576104746 l5.5 -2.6 l0 5.2 Z" fill="#7d5c2c"/><path d="M949.4157119476268 532.7168576104746 l-5.5 -2.6 l0 5.2 Z" fill="#7d5c2c"/><rect x="916.3657937806875" y="513.5543576104745" width="17" height="16.875" fill="#faf8f4"/><text x="924.8657937806875" y="526.7168576104746" font-size="12.5" fill="#7d5c2c" text-anchor="middle" font-weight="400">3</text><line x1="713" y1="189.99999999999994" x2="713" y2="239.09983633387884" stroke="#7d5c2c" stroke-width="1"/><path d="M713 189.99999999999994 l-2.6 5.5 l5.2 0 Z" fill="#7d5c2c"/><path d="M713 239.09983633387884 l-2.6 -5.5 l5.2 0 Z" fill="#7d5c2c"/><g transform="translate(713,214.5499181669394) rotate(-90)"><rect x="-8.5" y="-19.1625" width="17" height="16.875" fill="#faf8f4"/><text x="0" y="-6" font-size="12.5" fill="#7d5c2c" text-anchor="middle" font-weight="400">3</text></g><line x1="713" y1="793.6006546644845" x2="713" y2="875.4337152209494" stroke="#7d5c2c" stroke-width="1"/><path d="M713 793.6006546644845 l-2.6 5.5 l5.2 0 Z" fill="#7d5c2c"/><path d="M713 875.4337152209494 l-2.6 -5.5 l5.2 0 Z" fill="#7d5c2c"/><g transform="translate(713,834.517184942717) rotate(-90)"><rect x="-8.5" y="-19.1625" width="17" height="16.875" fill="#faf8f4"/><text x="0" y="-6" font-size="12.5" fill="#7d5c2c" text-anchor="middle" font-weight="400">5</text></g><text x="713" y="512.3502454991817" font-size="12.5" fill="#7d5c2c" text-anchor="middle" font-weight="700" letter-spacing="1.6">ЗОНА ЗАСТРОЙКИ</text><text x="713" y="534.3502454991817" font-size="15" fill="#7d5c2c" text-anchor="middle" font-weight="400">776 м²</text><rect x="22" y="22" width="1756" height="1156" fill="none" stroke="#ddd6c9" stroke-width="1"/><text x="96" y="92" font-size="27" fill="#2c332e" text-anchor="start" font-weight="600" font-family="'TT Ramillas','Playfair Display',Georgia,'Times New Roman',serif">Как читать схему участка</text><text x="96" y="116" font-size="14.5" fill="#5a615a" text-anchor="start" font-weight="400">Что показывает чертёж в карточке каждого участка</text><g transform="translate(1704,108)"><path d="M0 -20 L8.4 14.399999999999999 L0 6.800000000000001 Z" fill="#a8814f"/><path d="M0 -20 L-8.4 14.399999999999999 L0 6.800000000000001 Z" fill="none" stroke="#7d5c2c" stroke-width="1.2"/><text x="0" y="-28" font-size="13" fill="#7d5c2c" text-anchor="middle" font-weight="700" letter-spacing="0.5">С</text></g><text x="1360" y="496" font-size="11.5" fill="#7c8279" text-anchor="start" font-weight="600" letter-spacing="1.2">ОБОЗНАЧЕНИЯ</text><rect x="1360" y="510" width="20" height="13" fill="#ffffff" stroke="#2c332e" stroke-width="1"/><text x="1390" y="520" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Границы участка</text><rect x="1360" y="536" width="20" height="13" fill="none" stroke="#a8814f" stroke-width="1" stroke-dasharray="5 4"/><rect x="1360" y="536" width="20" height="13" fill="url(#h-build)"/><text x="1390" y="546" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Где допускается дом</text><rect x="1360" y="562" width="20" height="13" fill="#ece6db" stroke="#cfc6b6" stroke-width="1"/><text x="1390" y="572" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Проезд</text><rect x="96" y="1108" width="163.66612111292963" height="7" fill="#5a615a" stroke="#5a615a" stroke-width="1"/><rect x="259.66612111292966" y="1108" width="163.66612111292963" height="7" fill="#faf8f4" stroke="#5a615a" stroke-width="1"/><text x="96" y="1130" font-size="12" fill="#7c8279" text-anchor="middle" font-weight="400">0</text><text x="259.66612111292966" y="1130" font-size="12" fill="#7c8279" text-anchor="middle" font-weight="400">10</text><text x="423.33224222585926" y="1130" font-size="12" fill="#7c8279" text-anchor="middle" font-weight="400">20 м</text><text x="1360" y="150" font-size="15.5" fill="#2c332e" text-anchor="start" font-weight="600">Сплошной контур</text><text x="1360" y="172" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Границы участка. В углах — межевые</text><text x="1360" y="191" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">точки, размеры сторон в метрах.</text><text x="1360" y="226" font-size="15.5" fill="#2c332e" text-anchor="start" font-weight="600">Пунктир и штриховка</text><text x="1360" y="248" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Зона, в которой допускается разместить</text><text x="1360" y="267" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">дом. Её площадь подписана внутри.</text><text x="1360" y="302" font-size="15.5" fill="#2c332e" text-anchor="start" font-weight="600">Стрелки к границам</text><text x="1360" y="324" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Нормативные отступы. От проезда</text><text x="1360" y="343" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">больше, от боковых и задней — меньше.</text><text x="1360" y="1050" font-size="12.5" fill="#7d5c2c" text-anchor="start" font-weight="600">Отступы демонстрационные.</text><text x="1360" y="1069" font-size="12.5" fill="#7c8279" text-anchor="start" font-weight="400">Фактические значения определяются</text><text x="1360" y="1087" font-size="12.5" fill="#7c8279" text-anchor="start" font-weight="400">ГПЗУ, ПЗЗ и техническими условиями.</text></svg>