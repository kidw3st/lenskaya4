1"/><text x="1323.8408323959504" y="287" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Набережная</text><rect x="1293.8408323959504" y="303" width="20" height="13" fill="#ffffff" stroke="#c6bfb1" stroke-width="1"/><text x="1323.8408323959504" y="313" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Земельные участки</text><text x="1293.8408323959504" y="380" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Четыре продольных коридора выводят</text><text x="1293.8408323959504" y="401" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">лес к воде и не дают застройке</text><text x="1293.8408323959504" y="422" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">сомкнуться в сплошную стену.</text><text x="1293.8408323959504" y="443" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400"></text><text x="1293.8408323959504" y="464" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">Поперечный бульвар связывает их</text><text x="1293.8408323959504" y="485" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">между собой: от любого участка</text><text x="1293.8408323959504" y="506" font-size="13.5" fill="#5a615a" text-anchor="start" font-weight="400">до зелени — меньше ста метров.</text><rect x="1293.8408323959504" y="1200" width="80.28683914510685" height="7" fill="#5a615a" stroke="#5a615a" stroke-width="1"/><rect x="1374.1276715410572" y="1200" width="80.28683914510685" height="7" fill="#faf8f4" stroke="#5a615a" stroke-width="1"/><rect x="1454.4145106861642" y="1200" width="80.28683914510685" height="7" fill="#5a615a" stroke="#5a615a" stroke-width="1"/><text x="1293.8408323959504" y="1222" font-size="12" fill="#7c8279" text-anchor="middle" font-weight="400">0</text><text x="1374.1276715410572" y="1222" font-size="12" fill="#7c8279" text-anchor="middle" font-weight="400">25</text><text x="1454.4145106861642" y="1222" font-size="12" fill="#7c8279" text-anchor="middle" font-weight="400">50</text><text x="1534.701349831271" y="1222" font-size="12" fill="#7c8279" text-anchor="middle" font-weight="400">75 м</text><text x="1293.8408323959504" y="1266" font-size="11.5" fill="#7c8279" text-anchor="start" font-weight="400">Демонстрационная посадка. Фактические границы</text><text x="1293.8408323959504" y="1283" font-size="11.5" fill="#7c8279" text-anchor="start" font-weight="400">определяются межеванием.</text></svg>